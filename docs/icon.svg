<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Document Sheet -->
  <g filter="url(#shadow)">
    <rect x="110" y="86" width="292" height="340" rx="24" fill="#ffffff" />
    <!-- Top Document Fold -->
    <path d="M330 86 L402 158 L330 158 Z" fill="#e2e8f0" />
    <path d="M402 158 L330 158 L330 86" fill="none" stroke="#cbd5e1" stroke-width="2" />

    <!-- Document Header Badge -->
    <rect x="146" y="130" width="130" height="20" rx="10" fill="#2563eb" />
    <rect x="146" y="166" width="220" height="12" rx="6" fill="#94a3b8" />
    <rect x="146" y="190" width="180" height="12" rx="6" fill="#cbd5e1" />
    <rect x="146" y="214" width="200" height="12" rx="6" fill="#cbd5e1" />

    <!-- Official Korean Emblem / KIIP Badge Circle -->
    <circle cx="256" cy="296" r="54" fill="url(#accentGrad)" />
    <!-- White checkmark & seal -->
    <path d="M236 296 L250 310 L278 280" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Document Footer Line -->
    <rect x="146" y="380" width="140" height="10" rx="5" fill="#94a3b8" />
    <circle cx="340" cy="385" r="14" fill="#ef4444" fill-opacity="0.8" />
  </g>

  <!-- Subtitle Tag: KIIP • TOPIK -->
  <rect x="146" y="442" width="220" height="34" rx="17" fill="#0f172a" fill-opacity="0.6" />
  <text x="256" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" letter-spacing="2">KIIP • TOPIK PC</text>
</svg>
